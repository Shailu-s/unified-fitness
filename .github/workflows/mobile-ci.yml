name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_NUTRITION_ENABLED: 'false'
      EXPO_PUBLIC_PHOTO_ESTIMATES_ENABLED: 'false'
      EXPO_PUBLIC_VOICE_ENABLED: 'false'
      EXPO_PUBLIC_SUPABASE_URL: ''
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
      NUTRITION_SMOKE_APPROVED: 'false'
      VOICE_SMOKE_APPROVED: 'false'
    steps:
      - name: Check out repository with checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up verified Node runtime with setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '25.6.1'
          package-manager-cache: false
      - name: Install pinned Yarn
        run: npm install --global yarn@1.22.22
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Validate public configuration
        run: yarn check:config
      - name: Typecheck
        run: yarn typecheck
      - name: Tests and reviewed passing-test baseline
        run: |
          node --test --test-reporter=tap tests/*.test.mjs | tee "$RUNNER_TEMP/mobile-tests.tap"
          node scripts/check-test-baseline.mjs "$RUNNER_TEMP/mobile-tests.tap" 116
      - name: Calendar boundary tests in India
        run: TZ=Asia/Kolkata yarn test
      - name: Calendar boundary tests in New York
        run: TZ=America/New_York yarn test
      - name: Export iOS bundle
        run: yarn expo export --platform ios --output-dir dist/ios
      - name: Export Android bundle
        run: yarn expo export --platform android --output-dir dist/android
